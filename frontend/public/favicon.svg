<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Dark navy background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0a2e"/>
      <stop offset="100%" stop-color="#1a0f3e"/>
    </linearGradient>
    <!-- Indigo-to-violet scale gradient -->
    <linearGradient id="scaleGrad" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <!-- Left pan fill gradient -->
    <linearGradient id="panLeft" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="1"/>
    </linearGradient>
    <!-- Right pan fill gradient -->
    <linearGradient id="panRight" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="1"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Soft glow for whole scale -->
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>

  <!-- Subtle radial glow in center background -->
  <ellipse cx="50" cy="48" rx="36" ry="28" fill="#4f46e5" opacity="0.10"/>

  <!-- Scale group with soft glow -->
  <g filter="url(#softglow)">

    <!-- Center post / stem -->
    <rect x="48.5" y="30" width="3" height="38" rx="1.5" fill="url(#scaleGrad)"/>

    <!-- Base line -->
    <rect x="24" y="68" width="52" height="3.5" rx="1.75" fill="url(#scaleGrad)"/>

    <!-- Top pivot circle -->
    <circle cx="50" cy="28" r="4" fill="url(#scaleGrad)"/>
    <circle cx="50" cy="28" r="2" fill="#0d0a2e"/>

    <!-- Horizontal beam -->
    <rect x="18" y="34" width="64" height="3" rx="1.5" fill="url(#scaleGrad)"/>

    <!-- Left side: wire + pan -->
    <!-- Left wire -->
    <line x1="22" y1="36" x2="22" y2="50" stroke="url(#scaleGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Left pan trapezoid shape -->
    <path d="M12 50 L32 50 L29 60 Q22 64 15 60 Z" fill="url(#panLeft)" opacity="0.95"/>
    <!-- Left pan rim line -->
    <line x1="12" y1="50" x2="32" y2="50" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Right side: wire + pan -->
    <!-- Right wire -->
    <line x1="78" y1="36" x2="78" y2="50" stroke="url(#scaleGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Right pan trapezoid shape -->
    <path d="M68 50 L88 50 L85 60 Q78 64 71 60 Z" fill="url(#panRight)" opacity="0.95"/>
    <!-- Right pan rim line -->
    <line x1="68" y1="50" x2="88" y2="50" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round"/>

  </g>
</svg>